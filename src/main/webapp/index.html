<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Control - Productos</title>
    <style>
        /* Estilos generales de la pagina */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        header {
            background: #0f766e;
            color: #fff;
            padding: 20px 32px;
        }
        header h1 { margin: 0; font-size: 1.5rem; }
        header p { margin: 4px 0 0; opacity: .85; font-size: .9rem; }
        main {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px;
            display: grid;
            gap: 20px;
        }
        .tarjeta {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
        }
        .tarjeta h2 { margin: 0 0 14px; font-size: 1.1rem; }

        /* Formulario */
        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
        }
        label { display: flex; flex-direction: column; font-size: .8rem; font-weight: 600; gap: 4px; }
        input {
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: .95rem;
        }
        input:focus { outline: 2px solid #14b8a6; border-color: transparent; }
        .acciones-form { display: flex; gap: 8px; align-items: flex-end; }

        /* Botones */
        button {
            border: 0;
            border-radius: 6px;
            padding: 9px 16px;
            cursor: pointer;
            font-size: .9rem;
            font-weight: 600;
        }
        .btn-principal { background: #0f766e; color: #fff; }
        .btn-principal:hover { background: #115e59; }
        .btn-secundario { background: #e2e8f0; color: #334155; }
        .btn-editar { background: #f59e0b; color: #fff; padding: 6px 12px; }
        .btn-eliminar { background: #dc2626; color: #fff; padding: 6px 12px; }

        /* Tabla */
        .contenedor-tabla { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; font-size: .8rem; text-transform: uppercase; color: #64748b; }
        td.num { text-align: right; }
        td.botones { white-space: nowrap; display: flex; gap: 6px; }
        .vacio { text-align: center; color: #94a3b8; padding: 24px; }

        /* Mensajes de estado */
        #mensaje {
            display: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: .9rem;
        }
        #mensaje.ok { display: block; background: #dcfce7; color: #166534; }
        #mensaje.error { display: block; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <header>
        <h1>Stock Control</h1>
        <p>Modulo de Productos</p>
    </header>

    <main>
        <div id="mensaje"></div>

        <section class="tarjeta">
            <h2 id="tituloFormulario">Nuevo producto</h2>
            <form id="formProducto">
                <!-- Guarda el id del producto cuando se esta editando -->
                <input type="hidden" id="productoId">
                <label>Nombre
                    <input type="text" id="nombre" required>
                </label>
                <label>Descripcion
                    <input type="text" id="descripcion">
                </label>
                <label>Precio
                    <input type="number" id="precio" min="0" step="0.01" required>
                </label>
                <label>Cantidad
                    <input type="number" id="cantidad" min="0" step="1" required>
                </label>
                <div class="acciones-form">
                    <button type="submit" class="btn-principal" id="btnGuardar">Guardar</button>
                    <button type="button" class="btn-secundario" id="btnCancelar" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section class="tarjeta">
            <h2>Listado de productos</h2>
            <div class="contenedor-tabla">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripcion</th>
                            <th class="num">Precio</th>
                            <th class="num">Cantidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // Ruta base de la API (relativa a esta pagina)
        var API_URL = "api/productos";

        var formulario = document.getElementById("formProducto");
        var tabla = document.getElementById("tablaProductos");
        var cuadroMensaje = document.getElementById("mensaje");
        var btnCancelar = document.getElementById("btnCancelar");

        /** Escapa texto para mostrarlo de forma segura dentro del HTML. */
        function escaparHtml(texto) {
            var div = document.createElement("div");
            div.textContent = texto == null ? "" : texto;
            return div.innerHTML;
        }

        /** Formatea un numero como moneda colombiana. */
        function formatearPrecio(valor) {
            return "$ " + Number(valor).toLocaleString("es-CO", { minimumFractionDigits: 2 });
        }

        /** Muestra un mensaje verde (ok) o rojo (error) y lo oculta a los 3 segundos. */
        function mostrarMensaje(texto, tipo) {
            cuadroMensaje.textContent = texto;
            cuadroMensaje.className = tipo;
            setTimeout(function () { cuadroMensaje.className = ""; }, 3000);
        }

        /** Consulta la API (GET) y dibuja la tabla de productos. */
        function cargarProductos() {
            fetch(API_URL)
                .then(function (resp) { return resp.json(); })
                .then(function (productos) {
                    if (productos.length === 0) {
                        tabla.innerHTML = '<tr><td colspan="6" class="vacio">No hay productos registrados</td></tr>';
                        return;
                    }
                    tabla.innerHTML = productos.map(function (p) {
                        return "<tr>" +
                            "<td>" + p.id + "</td>" +
                            "<td>" + escaparHtml(p.nombre) + "</td>" +
                            "<td>" + escaparHtml(p.descripcion) + "</td>" +
                            '<td class="num">' + formatearPrecio(p.precio) + "</td>" +
                            '<td class="num">' + p.cantidad + "</td>" +
                            '<td class="botones">' +
                                '<button class="btn-editar" onclick="editarProducto(' + p.id + ')">Editar</button>' +
                                '<button class="btn-eliminar" onclick="eliminarProducto(' + p.id + ')">Eliminar</button>' +
                            "</td></tr>";
                    }).join("");
                })
                .catch(function () {
                    mostrarMensaje("No se pudo conectar con la API", "error");
                });
        }

        /** Crea (POST) o actualiza (PUT) segun si hay un id cargado en el formulario. */
        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();

            var id = document.getElementById("productoId").value;
            var datos = new URLSearchParams();
            datos.append("nombre", document.getElementById("nombre").value);
            datos.append("descripcion", document.getElementById("descripcion").value);
            datos.append("precio", document.getElementById("precio").value);
            datos.append("cantidad", document.getElementById("cantidad").value);

            var editando = id !== "";
            var url = editando ? API_URL + "/" + id : API_URL;

            fetch(url, {
                method: editando ? "PUT" : "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: datos.toString()
            })
            .then(function (resp) {
                return resp.json().then(function (cuerpo) {
                    if (!resp.ok) { throw new Error(cuerpo.mensaje); }
                    return cuerpo;
                });
            })
            .then(function () {
                mostrarMensaje(editando ? "Producto actualizado" : "Producto creado", "ok");
                reiniciarFormulario();
                cargarProductos();
            })
            .catch(function (error) {
                mostrarMensaje(error.message, "error");
            });
        });

        /** Carga un producto en el formulario para editarlo (GET por id). */
        function editarProducto(id) {
            fetch(API_URL + "/" + id)
                .then(function (resp) { return resp.json(); })
                .then(function (p) {
                    document.getElementById("productoId").value = p.id;
                    document.getElementById("nombre").value = p.nombre;
                    document.getElementById("descripcion").value = p.descripcion;
                    document.getElementById("precio").value = p.precio;
                    document.getElementById("cantidad").value = p.cantidad;
                    document.getElementById("tituloFormulario").textContent = "Editar producto #" + p.id;
                    btnCancelar.hidden = false;
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });
        }

        /** Elimina un producto (DELETE) despues de pedir confirmacion. */
        function eliminarProducto(id) {
            if (!confirm("Eliminar el producto #" + id + "?")) {
                return;
            }
            fetch(API_URL + "/" + id, { method: "DELETE" })
                .then(function (resp) {
                    return resp.json().then(function (cuerpo) {
                        if (!resp.ok) { throw new Error(cuerpo.mensaje); }
                        return cuerpo;
                    });
                })
                .then(function () {
                    mostrarMensaje("Producto eliminado", "ok");
                    cargarProductos();
                })
                .catch(function (error) {
                    mostrarMensaje(error.message, "error");
                });
        }

        /** Limpia el formulario y lo deja en modo "nuevo producto". */
        function reiniciarFormulario() {
            formulario.reset();
            document.getElementById("productoId").value = "";
            document.getElementById("tituloFormulario").textContent = "Nuevo producto";
            btnCancelar.hidden = true;
        }

        btnCancelar.addEventListener("click", reiniciarFormulario);

        // Al abrir la pagina se cargan los productos
        cargarProductos();
    </script>
</body>
</html>
